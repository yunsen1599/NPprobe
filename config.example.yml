# NPprobe 测试端配置（安装脚本会生成 /etc/npprobe/config.yml）
# 面板接口地址（和节点安装命令里的 --api-host 一样，带 /api）
panel: https://panel.example.com/api
# 面板 → 运维管理 → 测试端，新建或重置 token 后显示（只显示一次）
token: npp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
# debug / info / warn
log_level: info
# 自升级下载安装包的 GitHub 仓库（必须公开）
release_repo: yunsen1599/NPprobe
# 补报缓存等运行数据
state_dir: /var/lib/npprobe
